name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
      - '.github/workflows/proxy_test.yml'
      - '.github/workflows/shellcheck.yml'
      - '.github/workflows/tests/check_proxy_auth.py'
      - '.github/workflows/tests/test_proxy_auth.py'
      - '.github/workflows/tests/check_secret_mounts.py'
      - '.github/workflows/buildx.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'manage.sh'
      - 'run.sh'

permissions:
  contents: read

jobs:
  shellcheck:
    if: github.repository_owner == 'hwdsl2'
    uses: ./.github/workflows/shellcheck.yml

  proxy_test:
    if: github.repository_owner == 'hwdsl2'
    uses: ./.github/workflows/proxy_test.yml

  buildx:
    needs: [shellcheck, proxy_test]
    uses: ./.github/workflows/buildx.yml
    secrets:
      CACHE_NAME: ${{ secrets.CACHE_NAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      QUAY_USER: ${{ secrets.QUAY_USER }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      BUILD_ONLY: ${{ secrets.BUILD_ONLY }}
