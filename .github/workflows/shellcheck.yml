name: shellcheck

on: workflow_call

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'hwdsl2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check
        run: |
          if [ ! -x /usr/bin/shellcheck ]; then
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get -yqq update
            sudo apt-get -yqq install shellcheck
          fi

          cd "$GITHUB_WORKSPACE"
          pwd
          ls -ld litellm.env.example

          export SHELLCHECK_OPTS="-e SC1090,SC1091"
          shellcheck --version
          shopt -s globstar
          ls -ld -- **/*.sh
          shellcheck **/*.sh
      - name: Check HTTP authentication probe
        run: python3 -B -I .github/workflows/tests/test_proxy_auth.py -v
